<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gather round</title>
  <style>
    :root {
      --bg-1: #1a2a6c;
      --text-1: #ffffff;
      --accent-1: #e0e0ff;

      --bg-2: #00c6ff;
      --text-2: #1a1a2e;
      --accent-2: #00d8ff;

      --bg-3: #ff6b6b;
      --text-3: #ffffff;
      --accent-3: #ffcccb;

      --bg-4: #0072ff;
      --text-4: #ffffff;
      --accent-4: #00b4ff;

      --bg-5: #00d68a;
      --text-5: #1a1a2e;
      --accent-5: #00e6a2;

      --bg-6: #a9355d;
      --text-6: #ffffff;
      --accent-6: #f0d9e9;

      --bg-7: #f72585;
      --text-7: #ffffff;
      --accent-7: #ffc0eb;

      --bg-8: #7140c4;
      --text-8: #ffffff;
      --accent-8: #b1a3ff;

      --bg-9: #a385d1;
      --text-9: #1a1a2e;
      --accent-9: #d9c0ff;

      --bg-10: #f8d126;
      --text-10: #1a1a2e; 
      --accent-10: #ffe680;
    }


    section {
      padding: 40px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
    }

    section:nth-of-type(2) {
      background-color: var(--bg-1);
    }

    section:nth-of-type(3) {
      background-color: var(--bg-2);
    }

    section:nth-of-type(4) {
      background-color: var(--bg-3);
    }

    section:nth-of-type(5) {
      background-color: var(--bg-4);
    }

    section:nth-of-type(6) {
      background-color: var(--bg-5);
    }

    section:nth-of-type(7) {
      background-color: var(--bg-6);
    }

    section:nth-of-type(8) {
      background-color: var(--bg-7);
    }

    section:nth-of-type(9) {
      background-color: var(--bg-8);
      color: var(--text-8);
    }

    section:nth-of-type(10) {
      background-color: var(--bg-9);
    }

    section:nth-of-type(11) {
      background-color: var(--bg-10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      display: flex;
    }

    .hero {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20vh 20px;
      flex: 1;
    }

    .hero-content {
      max-width: 800px;
    }

    h1 {
      font-size: 4.5rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      font-weight: 700;
    }

    .subheader {
      font-size: 2rem;
      margin-bottom: 3rem;
      opacity: 0.9;
      font-weight: 300;
      line-height: 1.4;
    }

    .content {
      /* background: linear-gradient(135deg, #00c6ff, #0072ff); */
      color: white;
      display: flex;
      flex: 1;
      padding: 40px 20px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      max-width: 1600px;
      margin: 0 auto;
      align-items: center;
        grid-template-areas: 
        "text image";
      
      transition: all 0.3s ease;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 25px;
      background: whitesmoke;
      border-radius: 20px;
      justify-content: center; 
    }

    .text-column h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #000000;
    }

    .text-column p {
      font-size: 1.25rem;
      opacity: 0.9;
      line-height: 1.7;
      color: #000000;
    }

    .image-column {
      display: flex;
      align-items: center;
      justify-content: center;

    }

    .image-container {
      width: 100%;
      max-width: 500px;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
    }


    .image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    section:nth-of-type(2n) .content-grid .text-column {
      order: 1
    }
    section:nth-of-type(2n) .content-grid .image-column {
      order: -1
    }

    @media (max-width: 992px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
      
      .image-column {
        display: none;
      }
      
      .hero h1 {
        font-size: 3.5rem;
      }
      
      .hero .subheader {
        font-size: 1.7rem;
      }
    }

  </style>
</head>
<body>
  <section class="container hero">
    <div class="hero-content">
      <h1>Gather round!</h1>
      <div class="subheader">Are you sitting comfortably? Then let's begin...</div>
    </div>
  </section>
